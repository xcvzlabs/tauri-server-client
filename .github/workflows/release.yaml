name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Draft Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create or Reuse Draft Release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(awk -v tag="$TAG" '
            $0 == "## " tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="See CHANGELOG.md for release notes."
          fi

          release_id=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n 1)

          if [ -z "$release_id" ]; then
            release_id=$(gh api "repos/${{ github.repository }}/releases" \
              -f tag_name="$TAG" \
              -f name="$TAG" \
              -f body="$notes" \
              -F draft=true \
              -F prerelease=false \
              --jq '.id')
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  release:
    name: Release (${{ matrix.target }})
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: blacksmith-6vcpu-macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: blacksmith-6vcpu-macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          # - platform: blacksmith-4vcpu-windows-2025
          #   target: x86_64-pc-windows-msvc
          #   args: --target x86_64-pc-windows-msvc --bundles nsis
          # - platform: blacksmith-4vcpu-ubuntu-2404
          #   target: x86_64-unknown-linux-gnu
          #   args: --target x86_64-unknown-linux-gnu --bundles deb

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux Tauri dependencies
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            patchelf

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Build and upload Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterJson: false
          retryAttempts: 3
          tauriScript: bunx tauri
          args: ${{ matrix.args }}
