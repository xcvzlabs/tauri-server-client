name: Setup project
description: Set up Bun and Node.js (cached) and install dependencies. Assumes the repo has already been checked out.

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: lts/*

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
